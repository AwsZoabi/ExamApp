name: examapp-final-microservices

services:
  gateway:
    build:
      context: ./gateway
    image: examapp-gateway:local
    init: true
    environment:
      PORT: "3000"
      SCORING_SERVICE_URL: http://scoring-service:5002
      ANALYTICS_SERVICE_URL: http://analytics-service:5001
      UPSTREAM_TIMEOUT_MS: "4000"
    ports:
      - "3000:3000"
    depends_on:
      scoring-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - examapp-microservices-network

  scoring-service:
    build:
      context: ./scoring-service
    image: examapp-scoring:local
    init: true
    environment:
      PORT: "5002"
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - examapp-microservices-network

  analytics-service:
    build:
      context: ./analytics-service
    image: examapp-analytics:local
    init: true
    environment:
      PORT: "5001"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - examapp-microservices-network

networks:
  examapp-microservices-network:
    name: examapp-final-microservices-network
    driver: bridge
