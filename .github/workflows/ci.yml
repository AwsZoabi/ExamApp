name: ExamApp CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-application:
    name: Client and API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Lint
        run: |
          npm run lint --prefix client
          npm run lint --prefix server

      - name: Test
        run: |
          npm run test --prefix client -- --run --coverage
          npm run test --prefix server -- --run --coverage

      - name: Build and syntax-check
        run: |
          npm run build --prefix client
          npm run check --prefix server

      - name: Validate core Compose configuration
        run: docker compose --env-file .env.example config --quiet

  microservices:
    name: Microservices
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: microservices/gateway/package-lock.json

      - name: Test gateway
        working-directory: microservices/gateway
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: microservices/scoring-service/requirements.txt

      - name: Test scoring service
        working-directory: microservices/scoring-service
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Build analytics service
        run: |
          dotnet restore microservices/analytics-service/AnalyticsService.csproj
          dotnet build microservices/analytics-service/AnalyticsService.csproj --configuration Release --no-restore --nologo

      - name: Validate microservices Compose
        run: docker compose -f microservices/docker-compose.yml config --quiet

  compose-integration:
    name: Container integration
    needs:
      - core-application
      - microservices
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start microservices
        run: docker compose -f microservices/docker-compose.yml up --build --detach --wait --wait-timeout 180

      - name: Run microservices smoke test
        shell: pwsh
        run: ./microservices/scripts/smoke-test.ps1

      - name: Show status
        if: always()
        run: docker compose -f microservices/docker-compose.yml ps

      - name: Show logs
        if: failure()
        run: docker compose -f microservices/docker-compose.yml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -f microservices/docker-compose.yml down --volumes --remove-orphans

